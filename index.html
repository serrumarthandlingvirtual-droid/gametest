<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🏍️ Neon Rider - 3D Motorcycle Racing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
  canvas { display: block; }

  #hud {
    position: absolute; top: 20px; left: 20px;
    color: #fff; font-size: 18px; font-weight: bold;
    text-shadow: 2px 2px 4px #000;
    background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px;
    border: 2px solid #00ff88;
  }
  #hud div { margin: 5px 0; }

  #speedometer {
    position: absolute; bottom: 30px; right: 30px;
    width: 150px; height: 150px;
    background: radial-gradient(circle, #222 0%, #000 100%);
    border: 4px solid #00ff88; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #00ff88; font-size: 32px; font-weight: bold;
    text-shadow: 0 0 10px #00ff88;
  }

  #menu, #levelComplete, #gameOver {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; z-index: 10;
  }
  #menu h1, #levelComplete h1, #gameOver h1 {
    font-size: 60px; color: #00ff88;
    text-shadow: 0 0 20px #00ff88;
    margin-bottom: 20px;
  }
  .btn {
    padding: 15px 40px; margin: 10px;
    font-size: 20px; font-weight: bold;
    background: linear-gradient(45deg, #00ff88, #00cc66);
    border: none; border-radius: 30px;
    cursor: pointer; color: #000;
    transition: transform 0.2s;
  }
  .btn:hover { transform: scale(1.1); }
  .hidden { display: none !important; }

  #levelInfo {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 50px; color: #ffcc00;
    text-shadow: 0 0 20px #ffcc00;
    opacity: 0; transition: opacity 0.5s;
    pointer-events: none;
  }
  #controls {
    position: absolute; bottom: 20px; left: 20px;
    color: #fff; font-size: 14px;
    background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
  }
</style>
</head>
<body>

<div id="menu">
  <h1>️ NEON RIDER</h1>
  <p style="margin-bottom:20px; font-size:18px;">Race through 3 epic levels!</p>
  <button class="btn" onclick="startGame()">START GAME</button>
  <div style="margin-top:30px; text-align:center;">
    <p> Controls:</p>
    <p>️ / W = Accelerate | ️ / S = Brake</p>
    <p>⬅️ / A = Left | ➡️ / D = Right</p>
  </div>
</div>

<div id="levelComplete" class="hidden">
  <h1>LEVEL COMPLETE! 🏆</h1>
  <p id="levelStats" style="font-size:24px; margin:20px;"></p>
  <button class="btn" onclick="nextLevel()">NEXT LEVEL</button>
</div>

<div id="gameOver" class="hidden">
  <h1>GAME OVER </h1>
  <p style="font-size:24px; margin:20px;">You crashed too many times!</p>
  <button class="btn" onclick="restartLevel()">TRY AGAIN</button>
  <button class="btn" onclick="backToMenu()">MENU</button>
</div>

<div id="hud" class="hidden">
  <div>🏁 Level: <span id="levelNum">1</span> / 3</div>
  <div> Distance: <span id="distance">0</span> m</div>
  <div>⏱️ Time: <span id="time">0</span>s</div>
  <div>💥 Crashes: <span id="crashes">0</span> / 5</div>
</div>

<div id="speedometer" class="hidden">0</div>

<div id="levelInfo"></div>

<div id="controls" class="hidden">
  ⬆️⬇️⬅️➡️ or WASD to ride
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============ GAME STATE ============
let scene, camera, renderer, motorcycle, road;
let currentLevel = 1;
let speed = 0, maxSpeed = 2, acceleration = 0.02, braking = 0.04;
let playerX = 0, playerZ = 0;
let distanceTraveled = 0, startTime = 0, crashes = 0;
let keys = {};
let obstacles = [], roadSegments = [];
let gameActive = false, levelLength = 5000;
let clock = new THREE.Clock();

// ============ LEVEL CONFIGS ============
const levels = {
  1: { name: "🌆 City Highway", sky: 0x87ceeb, fog: 0xaaccff, ground: 0x3a7a3a, road: 0x333333, maxSpeed: 2, length: 4000, obstacleCount: 15 },
  2: { name: "️ Desert Canyon", sky: 0xff8844, fog: 0xffaa66, ground: 0xc4883a, road: 0x554433, maxSpeed: 2.5, length: 5000, obstacleCount: 25 },
  3: { name: "🌃 Neon Night City", sky: 0x0a0a2a, fog: 0x1a1a4a, ground: 0x111122, road: 0x222244, maxSpeed: 3, length: 6000, obstacleCount: 35 }
};

// ============ INIT ============
function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(50, 100, 50);
  sun.castShadow = true;
  scene.add(sun);

  // Motorcycle
  motorcycle = createMotorcycle();
  scene.add(motorcycle);

  // Input
  window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
  window.addEventListener('resize', onResize);

  animate();
}

// ============ MOTORCYCLE MODEL ============
function createMotorcycle() {
  const bike = new THREE.Group();

  // Body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 0.5, 2),
    new THREE.MeshPhongMaterial({ color: 0xff2244 })
  );
  body.position.y = 0.5;
  body.castShadow = true;
  bike.add(body);

  // Front wheel
  const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
  const wheelMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
  const frontWheel = new THREE.Mesh(wheelGeo, wheelMat);
  frontWheel.rotation.z = Math.PI / 2;
  frontWheel.position.set(0, 0.4, 1);
  bike.add(frontWheel);

  // Back wheel
  const backWheel = new THREE.Mesh(wheelGeo, wheelMat);
  backWheel.rotation.z = Math.PI / 2;
  backWheel.position.set(0, 0.4, -1);
  bike.add(backWheel);

  // Rider
  const rider = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.8, 0.5),
    new THREE.MeshPhongMaterial({ color: 0x2244aa })
  );
  rider.position.set(0, 1.1, -0.2);
  bike.add(rider);

  // Head
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 16, 16),
    new THREE.MeshPhongMaterial({ color: 0xffcc88 })
  );
  head.position.set(0, 1.6, -0.2);
  bike.add(head);

  // Helmet
  const helmet = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 16, 16),
    new THREE.MeshPhongMaterial({ color: 0xff0000 })
  );
  helmet.position.set(0, 1.65, -0.2);
  bike.add(helmet);

  return bike;
}

// ============ LEVEL BUILDER ============
function buildLevel(levelNum) {
  // Clear old
  while(scene.children.length > 0) scene.remove(scene.children[0]);
  obstacles = []; roadSegments = [];

  const cfg = levels[levelNum];
  scene.background = new THREE.Color(cfg.sky);
  scene.fog = new THREE.Fog(cfg.fog, 50, 200);

  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(50, 100, 50);
  sun.castShadow = true;
  scene.add(sun);

  if (levelNum === 3) {
    const neon = new THREE.PointLight(0xff00ff, 1, 100);
    neon.position.set(0, 20, 0);
    scene.add(neon);
  }

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(2000, cfg.length + 500),
    new THREE.MeshPhongMaterial({ color: cfg.ground })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0;
  ground.position.z = -cfg.length/2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Road
  const roadGeo = new THREE.PlaneGeometry(12, cfg.length);
  const roadMat = new THREE.MeshPhongMaterial({ color: cfg.road });
  road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0.01;
  road.position.z = -cfg.length/2;
  road.receiveShadow = true;
  scene.add(road);

  // Road lines
  for (let i = 0; i < cfg.length/10; i++) {
    const line = new THREE.Mesh(
      new THREE.PlaneGeometry(0.3, 3),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    line.rotation.x = -Math.PI / 2;
    line.position.set(0, 0.02, -i*10);
    scene.add(line);
  }

  // Obstacles
  for (let i = 0; i < cfg.obstacleCount; i++) {
    const z = -100 - Math.random() * (cfg.length - 200);
    const x = (Math.random() - 0.5) * 10;
    const obstacle = createObstacle(levelNum);
    obstacle.position.set(x, 0, z);
    scene.add(obstacle);
    obstacles.push(obstacle);
  }

  // Scenery (trees/buildings)
  for (let i = 0; i < 60; i++) {
    const z = -Math.random() * cfg.length;
    const side = Math.random() > 0.5 ? 1 : -1;
    const x = side * (8 + Math.random() * 30);
    const scenery = createScenery(levelNum);
    scenery.position.set(x, 0, z);
    scene.add(scenery);
  }

  // Finish line
  const finish = new THREE.Mesh(
    new THREE.PlaneGeometry(12, 2),
    new THREE.MeshBasicMaterial({ color: 0xffff00 })
  );
  finish.rotation.x = -Math.PI / 2;
  finish.position.set(0, 0.02, -cfg.length + 10);
  scene.add(finish);

  // Reset player
  playerX = 0; playerZ = 0;
  motorcycle.position.set(0, 0, 0);
  speed = 0;
  distanceTraveled = 0;
  crashes = 0;
  levelLength = cfg.length;
  maxSpeed = cfg.maxSpeed;
}

// ============ OBSTACLES ============
function createObstacle(levelNum) {
  const group = new THREE.Group();
  if (levelNum === 1) {
    // Cars
    const car = new THREE.Mesh(
      new THREE.BoxGeometry(2, 1, 3),
      new THREE.MeshPhongMaterial({ color: [0x00ff00, 0x0088ff, 0xffff00][Math.floor(Math.random()*3)] })
    );
    car.position.y = 0.5;
    car.castShadow = true;
    group.add(car);
  } else if (levelNum === 2) {
    // Rocks
    const rock = new THREE.Mesh(
      new THREE.DodecahedronGeometry(1),
      new THREE.MeshPhongMaterial({ color: 0x886644 })
    );
    rock.position.y = 0.8;
    rock.castShadow = true;
    group.add(rock);
  } else {
    // Neon barriers
    const barrier = new THREE.Mesh(
      new THREE.BoxGeometry(3, 1.5, 0.5),
      new THREE.MeshPhongMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 0.5 })
    );
    barrier.position.y = 0.75;
    group.add(barrier);
  }
  return group;
}

// ============ SCENERY ============
function createScenery(levelNum) {
  const group = new THREE.Group();
  if (levelNum === 1) {
    // Trees
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 3), new THREE.MeshPhongMaterial({color:0x4a2a0a}));
    trunk.position.y = 1.5;
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshPhongMaterial({color:0x228822}));
    leaves.position.y = 3.5;
    group.add(trunk, leaves);
  } else if (levelNum === 2) {
    // Cacti
    const cactus = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 3), new THREE.MeshPhongMaterial({color:0x228822}));
    cactus.position.y = 1.5;
    group.add(cactus);
  } else {
    // Neon buildings
    const h = 5 + Math.random() * 15;
    const b = new THREE.Mesh(
      new THREE.BoxGeometry(4, h, 4),
      new THREE.MeshPhongMaterial({ color: 0x222244, emissive: 0x00ffff, emissiveIntensity: 0.3 })
    );
    b.position.y = h/2;
    group.add(b);
  }
  return group;
}

// ============ GAME LOGIC ============
function update(dt) {
  if (!gameActive) return;

  // Controls
  if (keys['arrowup'] || keys['w']) speed = Math.min(speed + acceleration, maxSpeed);
  else if (keys['arrowdown'] || keys['s']) speed = Math.max(speed - braking, 0);
  else speed = Math.max(speed - 0.005, 0);

  if (keys['arrowleft'] || keys['a']) playerX = Math.max(playerX - 0.15, -5);
  if (keys['arrowright'] || keys['d']) playerX = Math.min(playerX + 0.15, 5);

  // Move
  playerZ -= speed;
  distanceTraveled += speed;

  // Motorcycle lean
  motorcycle.position.x = playerX;
  motorcycle.position.z = playerZ;
  const lean = (keys['arrowleft']||keys['a'] ? 0.3 : 0) + (keys['arrowright']||keys['d'] ? -0.3 : 0);
  motorcycle.rotation.z = lean;
  motorcycle.rotation.x = -speed * 0.1;

  // Camera follow
  camera.position.set(playerX * 0.5, 4, playerZ + 10);
  camera.lookAt(playerX, 1, playerZ - 10);

  // Collision
  for (let obs of obstacles) {
    const dx = Math.abs(playerX - obs.position.x);
    const dz = Math.abs(playerZ - obs.position.z);
    if (dx < 1.5 && dz < 2) {
      speed *= 0.3;
      crashes++;
      obs.position.x += (playerX > obs.position.x ? -5 : 5);
      document.getElementById('crashes').textContent = crashes;
      if (crashes >= 5) gameOver();
    }
  }

  // HUD
  document.getElementById('distance').textContent = Math.floor(distanceTraveled);
  document.getElementById('time').textContent = Math.floor((Date.now() - startTime)/1000);
  document.getElementById('speedometer').textContent = Math.floor(speed * 100);

  // Level complete
  if (distanceTraveled >= levelLength) levelComplete();
}

// ============ UI ============
function startGame() {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('speedometer').classList.remove('hidden');
  document.getElementById('controls').classList.remove('hidden');
  currentLevel = 1;
  loadLevel(1);
}

function loadLevel(n) {
  buildLevel(n);
  document.getElementById('levelNum').textContent = n;
  gameActive = true;
  startTime = Date.now();

  // Show level name
  const info = document.getElementById('levelInfo');
  info.textContent = levels[n].name;
  info.style.opacity = 1;
  setTimeout(() => info.style.opacity = 0, 2500);
}

function levelComplete() {
  gameActive = false;
  if (currentLevel < 3) {
    document.getElementById('levelStats').textContent =
      `Time: ${Math.floor((Date.now()-startTime)/1000)}s | Crashes: ${crashes}`;
    document.getElementById('levelComplete').classList.remove('hidden');
  } else {
    document.getElementById('gameOver').querySelector('h1').textContent = '🏆 YOU WIN! ';
    document.getElementById('gameOver').querySelector('p').textContent =
      `All 3 levels complete! Total crashes: ${crashes}`;
    document.getElementById('gameOver').classList.remove('hidden');
  }
}

function nextLevel() {
  document.getElementById('levelComplete').classList.add('hidden');
  currentLevel++;
  loadLevel(currentLevel);
}

function restartLevel() {
  document.getElementById('gameOver').classList.add('hidden');
  loadLevel(currentLevel);
}

function gameOver() {
  gameActive = false;
  document.getElementById('gameOver').querySelector('h1').textContent = 'GAME OVER 💥';
  document.getElementById('gameOver').querySelector('p').textContent = 'Too many crashes!';
  document.getElementById('gameOver').classList.remove('hidden');
}

function backToMenu() {
  document.getElementById('gameOver').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('speedometer').classList.add('hidden');
  document.getElementById('controls').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  update(dt);
  renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
